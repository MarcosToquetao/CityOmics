# Ambiente local do CityOmics (D9). Criar com:
#   mamba env create -f environment.yml && conda activate cityomics
# Depois de estabilizar, gerar lock reprodutível: conda-lock -f environment.yml -p linux-64
name: cityomics
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # dados e I/O
  - pandas>=2.2
  - polars
  - duckdb
  - pyarrow
  - python-calamine
  - openpyxl
  # geoespacial
  - geopandas>=1.0
  - shapely>=2.0
  - pyogrio
  - rasterio
  - rioxarray
  - xarray
  - h3-py>=4
  - osmnx
  - libpysal
  - esda
  - spreg
  - mgwr
  # modelos
  - scikit-learn
  - statsmodels
  - lightgbm
  - shap
  # omics
  - anndata
  - mudata
  - scanpy>=1.11,<1.12   # squidpy 1.7 usa API interna removida no scanpy 1.12
  - squidpy
  - leidenalg
  - imagecodecs   # exigido pelo squidpy
  - xlrd          # leitura dos dicionários .xls do Censo 2010
  - h5py          # leitura do HDF5 do VIIRS Black Marble
  # utilidades
  - typer
  - pytest
  - ruff
  - pip:
      - -e .
      - elapid          # MaxEnt (spec-benchmark §3.2)
      - blackmarblepy   # VIIRS Black Marble (spec-dados §3.2)
      - cmcrameri       # escalas perceptualmente uniformes das figuras (D45, D62)
      - cairosvg        # esquema da Fig. 1a (SVG → PDF vetorial, D50)
      - pypdf           # sobreposição do esquema no PDF da Fig. 1
      - vitessce        # explorador interativo (D48)
      - starlette       # exportação de arquivos do vitessce
      # - laya          # inferência local opcional; fine-tuning no Colab (D30)
