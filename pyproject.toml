[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "cityomics"
version = "0.0.1"
description = "Predição espacial de crimes em São Paulo com métodos de outras ciências e atlas de transcriptômica espacial urbana"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pandas>=2.2",
  "pyarrow>=15",
]

[project.optional-dependencies]
# O ambiente completo vem do environment.yml (conda-forge); os extras servem ao Colab,
# onde se instala só o necessário para cada notebook.
geo = ["geopandas>=1.0", "shapely>=2.0", "h3>=4.0", "osmnx>=1.9", "libpysal>=4.10", "esda>=2.5"]
omics = ["anndata>=0.10", "mudata>=0.3", "scanpy>=1.10", "squidpy>=1.5"]
models = ["lightgbm>=4.3", "shap>=0.45", "scikit-learn>=1.4", "statsmodels>=0.14"]
laya = ["laya"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
cityomics = "cityomics.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cityomics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
