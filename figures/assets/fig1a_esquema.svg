  <text x="3.2" y="5.6" font-size="2.12" fill="#FFFFFF">Tissue section</text>

  <!-- ===== Equivalências ===== -->
  <g font-size="2.12" fill="#1A1A1A">
    <text x="88" y="6.0" text-anchor="end">Cell</text>
    <text x="88" y="9.9" text-anchor="end">Spot</text>
    <text x="88" y="13.8" text-anchor="end">Interstitium and vessels</text>
    <text x="88" y="17.7" text-anchor="end">Niche</text>
    <text x="88" y="21.6" text-anchor="end">Ligand–receptor signal</text>
    <text x="88" y="25.5" text-anchor="end">Phenotype</text>
    <text x="96.5" y="6.0">Parcel (lot)</text>
    <text x="96.5" y="9.9">Census tract</text>
    <text x="96.5" y="13.8">Streets and stations</text>
    <text x="96.5" y="17.7">Neighbourhood composition</text>
    <text x="96.5" y="21.6">Crime generator → target</text>
    <text x="96.5" y="25.5">Crime</text>
  </g>
  <g stroke="#1A1A1A" stroke-width="0.3" marker-end="url(#seta)">
