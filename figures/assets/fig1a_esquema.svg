    <g fill="#0B0B0E" opacity="0.35">
      <rect x="127.2" y="19.6" width="1.6" height="1.4"/><rect x="129.4" y="19.4" width="1.4" height="1.6"/>
      <rect x="131.5" y="19.8" width="1.7" height="1.3"/><rect x="134" y="19.5" width="1.4" height="1.5"/>
      <rect x="128" y="22.2" width="1.5" height="1.5"/><rect x="130.3" y="22.4" width="1.8" height="1.3"/>
      <rect x="133" y="22.1" width="1.4" height="1.6"/><rect x="135.5" y="22.6" width="1.3" height="1.4"/>
      <rect x="127.4" y="24.8" width="1.6" height="1.5"/><rect x="129.8" y="25" width="1.5" height="1.4"/>
      <rect x="132.1" y="24.7" width="1.6" height="1.6"/>
    </g>
    <g stroke="#0B0B0E" stroke-width="0.3">
      <rect x="142" y="18.6" width="6" height="9" fill="#4F86C6"/>
      <rect x="148" y="18.6" width="4.5" height="9" fill="#4F86C6"/>
      <rect x="152.5" y="18.6" width="5" height="9" fill="#5DBB6C"/>
      <rect x="159.4" y="18.6" width="5.6" height="9" fill="#B0A190"/>
      <rect x="165" y="18.6" width="7" height="9" fill="#B0A190"/>
      <rect x="172" y="18.6" width="8" height="9" fill="#4F86C6"/>
