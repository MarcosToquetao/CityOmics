<?xml version="1.0" encoding="UTF-8"?>
<!-- Fig. 1a — esquema tecido ↔ cidade (D43, D50). Desenhado à mão; não depende de dados.
     Unidades do viewBox em mm (largura final de 183 mm). Fonte: Arial/Liberation Sans. -->
<svg xmlns="http://www.w3.org/2000/svg" width="183mm" height="30mm" viewBox="0 0 183 30"
     font-family="Arial, 'Liberation Sans', Helvetica, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="2.2" markerHeight="2.2" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#1A1A1A"/>
    </marker>
    <marker id="setaClara" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="2.4" markerHeight="2.4" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#FFD27F"/>
    </marker>
    <clipPath id="clipT"><rect x="2" y="2.5" width="56" height="25" rx="1"/></clipPath>
    <clipPath id="clipC"><rect x="125" y="2.5" width="56" height="25" rx="1"/></clipPath>
  </defs>

  <!-- ===== Tecido ===== -->
