      <rect x="148.1" y="4" width="6" height="10.4" fill="#B99BF0"/>
      <rect x="154.1" y="4" width="4" height="10.4" fill="#B4D4FF"/>
      <rect x="160" y="4" width="4.6" height="10.4" fill="#4F86C6"/>
      <rect x="164.6" y="4" width="4.6" height="10.4" fill="#4F86C6"/>
      <rect x="169.2" y="4" width="5.4" height="10.4" fill="#7FB3EE"/>
