    <line x1="89.2" y1="9.2" x2="95.2" y2="9.2"/>
    <line x1="89.2" y1="13.1" x2="95.2" y2="13.1"/>
    <line x1="89.2" y1="17.0" x2="95.2" y2="17.0"/>
    <line x1="89.2" y1="20.9" x2="95.2" y2="20.9"/>
    <line x1="89.2" y1="24.8" x2="95.2" y2="24.8"/>
  </g>

  <!-- ===== Cidade ===== -->
  <rect x="125" y="2.5" width="56" height="25" rx="1" fill="#0B0B0E"/>
  <g clip-path="url(#clipC)">
