  <text x="126.2" y="5.6" font-size="2.12" fill="#FFFFFF" opacity="0">.</text>
  <text x="179.8" y="26.4" font-size="2.12" fill="#FFFFFF" text-anchor="end">São Paulo</text>
</svg>
