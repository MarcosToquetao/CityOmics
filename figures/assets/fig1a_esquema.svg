    <g fill="#FFD27F"><circle cx="33" cy="16.3" r="0.35"/><circle cx="34.2" cy="16.9" r="0.35"/><circle cx="35.4" cy="17.4" r="0.35"/></g>
    <path d="M31,13.5 C33,16 36,17 38.6,17.6" stroke="#FFD27F" stroke-width="0.4" fill="none" marker-end="url(#setaClara)"/>
